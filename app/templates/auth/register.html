{% extends "base.html" %}

{% block title %}Sentinel - Register Analyst{% endblock %}

{% block content %}
<div style="max-width: 480px; margin: 3rem auto;">
  <div class="card">
    <div class="card-header">
      <h2 class="card-title">📝 Register New Analyst Account</h2>
    </div>

    <!-- NOTE (R19 Shortcut): No CSRF token implemented -->
    <form method="POST" action="{{ url_for('auth.register') }}">
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" placeholder="e.g. m_arriaga" required autofocus>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="Enter password" required>
      </div>

      <div class="form-group">
        <label for="role">System Role Designation</label>
        <select id="role" name="role">
          <option value="analyst" selected>Security Analyst (Default)</option>
          <option value="admin">System Administrator</option>
        </select>
      </div>

      <div style="margin-top: 1.5rem;">
        <button type="submit" class="btn btn-primary" style="width: 100%;">Create Account</button>
      </div>
    </form>

    <div style="margin-top: 1.5rem; text-align: center; font-size: 0.85rem; color: var(--text-muted);">
      Already registered? <a href="{{ url_for('auth.login') }}">Return to login</a>
    </div>
  </div>
</div>
{% endblock %}
